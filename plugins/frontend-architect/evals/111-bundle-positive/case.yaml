schema_version: "1.1"
name: bundle-positive
description: >
  Per-route bundle attribution of a BUILT Next.js app (copied from the committed route-next-app fixture).
  The /heavy route ships a heavy chunk in its initial set; route-attribution reports it as a heuristic lead,
  not a proven defect. Requires Bash for the plugin's route-attribution script
  (run with: claude plugin eval ./plugins/frontend-architect --case 111-bundle-positive --allow-tools Bash).
expected_outcome: "route-attribution run against the build; the /heavy route reported with a heavy initial chunk (route-heavy-initial-chunk, heuristic); framed as a lead to confirm in the analyzer, build-associated size not bytes transferred; no file modified"
tags: ["activation:architect", "domain:audit", "domain:performance", "domain:bundle", "suite:pilot"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    This Next.js app has a production build (.next) in the current directory. Attribute the client JavaScript
    to each route and tell me which route ships the most on initial load. Separate what the build demonstrates
    from what still needs to be confirmed in the browser.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's route-attribution script (route-attribution.mjs) against the build,
        and attributes initial client JS per route
      - Identifies /heavy as the route with the heaviest initial chunk (the route-heavy-initial-chunk lead),
        and does NOT flag /light, /shared-a or /shared-b (which are under the threshold) as heavy
      - Frames the heavy chunk as a HEURISTIC lead, not a proven defect: a hashed chunk name does not prove
        which library it is, and build-associated size is not bytes transferred/evaluated/used; confirmation
        needs the analyzer and a browser/Coverage check
      - Does not modify any file
      The response FAILS if it presents the heavy chunk as a confirmed defect, sums the shared chunk across
      routes into one inflated total, invents a heavy route that does not exist, or recommends a rewrite or
      microfrontends.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'route-attribution\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
