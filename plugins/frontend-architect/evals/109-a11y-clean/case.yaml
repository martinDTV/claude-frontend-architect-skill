schema_version: "1.1"
name: a11y-clean
description: >
  Accessibility audit of a small Nuxt 4 app with NO accessibility defect: the signup panel has a labelled
  input (for/id), an icon button named with aria-label, a brand image with alt, and a modal with
  role="dialog" and an accessible name. The model must NOT invent a defect. Requires Bash for the plugin's
  ui-audit script
  (run with: claude plugin eval ./plugins/frontend-architect --case 109-a11y-clean --allow-tools Bash).
expected_outcome: "ui-audit run; no confirmed accessibility defect reported; the model confirms every control is accessible (labelled input, named button, alt image, named dialog) instead of inventing a problem; result framed as static rule checks, not WCAG conformance; no file modified"
tags: ["activation:architect", "domain:audit", "domain:vue-nuxt", "domain:accessibility"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Audit the accessibility of the Nuxt 4 frontend in the current directory (read-only) and tell me what
    to fix first. Cite file paths with line numbers. Separate what you demonstrated in the code from what
    is only a risk.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's ui-audit script (ui-audit.mjs) or equivalent read-only
        inspection of the markup
      - Reports that there is NO confirmed accessibility defect from the static rules: the input is
        associated with a label (for/id), the icon button has an accessible name (aria-label), the image
        has an alt, and the dialog has an accessible name
      - Does NOT invent a defect, does NOT cite a form-control-without-label, button-without-accessible-name,
        img-missing-alt or dialog-without-name that the code does not contain
      - Notes that passing these static rule checks is NOT full WCAG conformance (a real pass needs a
        screen reader / keyboard test), rather than claiming the app is fully accessible
      - Labels its statements by evidence tier (demonstrated / measured / hypothetical)
      - Does not modify any file
      The response FAILS if it fabricates an accessibility defect, recommends a rewrite or microfrontends,
      reports the clean app as broken, or claims the static pass proves full WCAG conformance.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'ui-audit\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
  - name: subagent-activation
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"frontend-architect:'
    min: 1
    arm: with-only
