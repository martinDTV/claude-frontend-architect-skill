schema_version: "1.1"
name: perf-positive
description: >
  Performance audit of a small Next.js (App Router) app with TWO genuine defects on a client component
  that renders on the initial route: a top-level `import * as THREE from 'three'` pulled eagerly into the
  startup bundle, and a list rendered with key={Math.random()} that remounts every item each render.
  Requires Bash for the plugin's perf-audit script
  (run with: claude plugin eval ./plugins/frontend-architect --case 105-perf-positive --allow-tools Bash).
expected_outcome: "perf-audit run; the heavy static three import and the Math.random() list key both found with path:line; the random key treated as a confirmed syntactic fact and the heavy import as a bundle signal to measure; no file modified"
tags: ["activation:architect", "domain:audit", "domain:react-next", "domain:performance", "suite:pilot"]
max_turns: 30
timeout_seconds: 900
allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Audit the performance of the Next.js frontend in the current directory (read-only) and tell me what
    to fix first. Cite file paths with line numbers. Separate what you demonstrated in the code from what
    you measured and from what is only a risk.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's perf-audit script (perf-audit.mjs) or equivalent read-only
        inspection, and cites file paths with line numbers
      - Finds the top-level `import * as THREE from 'three'` in src/components/SceneHero.tsx (a heavy
        client dependency eagerly in the startup bundle) and the key={Math.random()} list key in the same
        file that remounts every item on each render
      - Treats the random list key as a confirmed / demonstrated syntactic fact, and the heavy import as a
        bundle signal to confirm by measuring (bundle-budget, build Coverage) rather than a measured
        slowdown
      - Recommends a stable id key and loading the 3D engine dynamically (next/dynamic) or below the fold
      - Labels findings by evidence tier (demonstrated / measured / hypothetical) and does not
        measured-claim a slowdown it did not measure
      - Does not invent additional defects the code does not contain
      - Does not modify any file
      The response FAILS if it asserts a measured slowdown it did not measure, recommends a rewrite or
      microfrontends, or invents defects not present in the scaffolded app.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'perf-audit\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
