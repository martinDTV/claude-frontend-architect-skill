schema_version: "1.1"
name: arch-positive
description: >
  Audit of a small Nuxt 4 app with ONE genuine architecture defect: the orders feature imports the
  billing feature's PRIVATE internals (features/billing/internal/calc), bypassing billing's public
  index.ts. Requires Bash for the plugin's scripts
  (run with: claude plugin eval ./plugins/frontend-architect --case 96-arch-positive --allow-tools Bash).
expected_outcome: "domain-deps run, the feature-internal-import at app/features/orders/useOrders.ts:1 found and named with path:line, findings separated by evidence tier, no file modified, no microfrontends"
tags: ["activation:architect", "domain:audit", "domain:vue-nuxt", "domain:architecture", "suite:pilot"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Audit the architecture and module boundaries of the Nuxt 4 frontend in the current directory
    (read-only) and tell me what to fix first. Cite file paths with line numbers. Separate what you
    demonstrated in the code from what you measured and from what is only a risk.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's domain-deps script (or equivalent read-only inspection of the
        imports) and cites file paths with line numbers
      - Finds that the orders feature imports the billing feature's private internals
        (app/features/billing/internal/calc) bypassing billing's public index.ts, and cites the
        offending import at app/features/orders/useOrders.ts (line 1)
      - Explains why this is a broken module boundary (billing's private pricing logic becomes coupled
        to orders) and recommends importing from app/features/billing/index.ts instead
      - Labels findings by evidence tier (demonstrated / measured / hypothetical) and treats the broken
        boundary as demonstrated in the code
      - Does not invent additional defects the code does not contain
      - Does not modify any file
      The response FAILS if it recommends microfrontends, a rewrite, or asserts defects that are not
      present in the scaffolded app.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'domain-deps\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
