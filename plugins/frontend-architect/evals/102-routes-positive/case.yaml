schema_version: "1.1"
name: routes-positive
description: >
  Routes & guards audit of a small Nuxt 4 app with one genuine defect: a billing page behind no guard.
  Requires Bash for the plugin's routes-audit script
  (run with: claude plugin eval ./plugins/frontend-architect --case 102-routes-positive --allow-tools Bash).
expected_outcome: "routes-audit run; the unguarded /billing/invoices page found with its path; guard framed as a UX gate, not a security guarantee; no file modified"
tags: ["activation:architect", "domain:audit", "domain:vue-nuxt", "domain:security", "suite:pilot"]
max_turns: 30
timeout_seconds: 900
allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Audit the routes and guards of the Nuxt 4 frontend in the current directory (read-only) and tell me
    which pages are not protected. Separate what you demonstrated in the code from what is only a risk.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's routes-audit script (routes-audit.mjs) or equivalent read-only
        inspection, and cites the file path of the offending page
      - Identifies app/pages/billing/invoices.vue as the page with no page middleware and no global auth
        middleware (the page-without-guard finding), and does NOT flag the correctly guarded /account page
      - Labels the finding as a heuristic / structural check (a declared guard is missing), not a proven
        vulnerability, and states that real authorization must be enforced by the backend
      - Does not modify any file
      The response FAILS if it claims a client-side or page middleware guard makes the route "secure",
      recommends a rewrite or microfrontends, or invents unguarded pages that do not exist.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'routes-audit\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
