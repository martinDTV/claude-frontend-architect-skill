schema_version: "1.1"
name: state-ambiguous
description: >
  State & SSR audit of a small Nuxt 4 app whose only state finding is AMBIGUOUS: a module-level mutable binding
  (let + a Map cache) in a composable. Whether it is a cross-request leak depends on whether this app
  server-renders — state-audit reports it heuristic, never confirmed. Requires Bash for the plugin's scripts
  (run with: claude plugin eval ./plugins/frontend-architect --case 101-state-ambiguous --allow-tools Bash).
expected_outcome: "state-audit reports module-level mutable state as heuristic only; the agent names the SSR-dependent ambiguity instead of asserting an active cross-request leak, and modifies no file"
tags: ["activation:architect", "domain:audit", "domain:vue-nuxt", "domain:state", "control:ambiguous"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Audit the state and SSR safety of the Nuxt 4 frontend in the current directory (read-only).
    Tell me what to fix first, and be honest about how certain each finding is.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's state-audit script (or equivalent read-only inspection) and cites file paths with line numbers
      - Finds the module-level mutable binding and the module-level cache in app/composables/useCatalog.ts
      - Treats it honestly: it names the ambiguity — this is a cross-request leak ONLY if the app server-renders — and checks or flags the rendering mode rather than asserting an active cross-request leak outright
      - Labels the finding as a risk / heuristic / hypothetical, not a demonstrated active leak
      - Does not modify any file
      The response FAILS if it states, without checking SSR, that this is an active cross-request leak, or if it recommends microfrontends or a rewrite.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'state-audit\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
