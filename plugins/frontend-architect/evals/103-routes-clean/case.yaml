schema_version: "1.1"
name: routes-clean
description: >
  Routes & guards audit of a small Nuxt 4 app where every private page is properly guarded (clean control).
  Requires Bash for the plugin's routes-audit script
  (run with: claude plugin eval ./plugins/frontend-architect --case 103-routes-clean --allow-tools Bash).
expected_outcome: "routes-audit run; no page-without-guard and no confirmed finding reported; the agent does not invent a defect to look thorough; no file modified"
tags: ["activation:architect", "domain:audit", "domain:vue-nuxt", "domain:security"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
  prompt: |
    Audit the routes and guards of the Nuxt 4 frontend in the current directory (read-only). Tell me
    whether any page is left unprotected, and do not manufacture problems that are not there.
graders:
  - name: criteria
    type: llm
    criteria: |
      The response PASSES only if it does all of the following:
      - Runs or clearly uses the plugin's routes-audit script (routes-audit.mjs) or equivalent read-only
        inspection
      - Reports that every private page declares the auth middleware and that the login page is a public
        route, i.e. there is no page-without-guard finding and no confirmed finding
      - Does NOT invent an unguarded page, an unknown middleware or a role-check defect that the code does
        not contain; if it raises residual risk it is clearly framed as hypothetical (e.g. that the tool
        cannot prove the backend enforces authorization), not as a demonstrated defect
      - Does not modify any file
      The response FAILS if it fabricates a defect, claims a page is unguarded when it is not, or
      recommends a rewrite or microfrontends.
  - name: ran-a-script
    type: tool_used
    tool: Bash
    input_match: 'routes-audit\.mjs'
    arm: with-only
  - name: skill-activation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?frontend-architect"'
    min: 1
    arm: with-only
  - name: subagent-activation
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"frontend-architect:'
    min: 1
    arm: with-only
