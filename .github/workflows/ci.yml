name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate ./plugins/frontend-architect
      - name: Check plugin distribution (manifests, references, scripts, evals)
        run: node verification/plugin-check.mjs
      - name: Install the verification vue project (supplies typescript and vue/compiler-sfc to the fixture tests)
        run: cd verification/vue && npm install --no-audit --no-fund
      - name: Test the audit scripts against the fixture apps
        run: node --test verification/tools/*.test.mjs
      - name: Install the browser verification tooling (Playwright and axe-core pinned in verification/browser) and Chromium
        run: cd verification/browser && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Test browser mode against the local fixture (FA_REQUIRE_BROWSER=1 fails instead of skipping when Chromium is missing)
        run: cd verification/browser && FA_REQUIRE_BROWSER=1 node --test browser-audit.test.mjs
      - name: Benchmark the lexical and semantic engines on the fixtures with ground truth
        run: node --expose-gc verification/tools/benchmark.mjs
      - name: Tools must run through a symbolic link (main-guard regression check)
        run: |
          LINK=$(mktemp -d) && ln -s "$PWD/plugins/frontend-architect/skills/frontend-architect/scripts" "$LINK/scripts"
          node "$LINK/scripts/domain-deps.mjs" verification/tools/fixtures/ts-paths --engine lexical --fail-on none | grep -q '^domain-deps (frontend-architect tools'
      - name: Check SKILL.md frontmatter
        run: |
          for f in plugins/frontend-architect/skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; exit 1; }
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "name/description missing: $f"; exit 1; }
            lines=$(wc -l < "$f"); [ "$lines" -le 500 ] || { echo "$f has $lines lines (max 500)"; exit 1; }
          done

  verify-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install verification projects
        run: |
          cd verification
          for p in vue react next creative; do (cd $p && npm install --no-audit --no-fund); done
          (cd nuxt && pnpm install)
          (cd browser && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Run all verifications
        run: FA_REQUIRE_BROWSER=1 ./verification/run-all.sh
