<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<main>
  <h1>Sign in</h1>
  <!-- a credential form: the browser mode must never submit it, even with --allow-submit -->
  <form id="login" method="post" action="/api/submit?form=login">
    <label for="user">User name</label>
    <input id="user" name="user" type="text" autocomplete="username" required>
    <label for="pass">Password</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
