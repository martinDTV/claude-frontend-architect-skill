<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reflow: only a data table overflows</title><link rel="stylesheet" href="/styles.css">

<body>
<header class="site"><strong>Fixture</strong></header>
<main id="main">
  <h1>Only a data table overflows</h1>
  <p>Everything else reflows at 320 px. A data table is two-dimensional content, which SC 1.4.10 excepts; the finding is a lead to verify that it scrolls in a labelled region.</p>
  <table class="data"><caption>Quarterly figures</caption><thead><tr><th>Quarter</th><th>Revenue</th><th>Costs</th><th>Margin</th></tr></thead><tbody><tr><td>Q1</td><td>120</td><td>80</td><td>40</td></tr></tbody></table>
</main>
</body>
