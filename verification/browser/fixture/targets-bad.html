<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Small targets</title><link rel="stylesheet" href="/styles.css">
<style>
  .toolbar { display: flex; gap: 0; }
  .icon { width: 20px; height: 20px; padding: 0; margin: 0; border: 1px solid #333; background: #fff; }
</style>
</head>
<body>
<header class="site"><strong>Fixture</strong></header>
<main id="main">
  <h1>Targets below 24 by 24 CSS pixels</h1>
  <p>Three adjacent 20 px buttons with no spacing between them: too small and too close (SC 2.5.8).</p>
  <div class="toolbar" role="toolbar" aria-label="Actions">
    <button type="button" class="icon" aria-label="Bold">B</button>
    <button type="button" class="icon" aria-label="Italic">I</button>
    <button type="button" class="icon" aria-label="Underline">U</button>
  </div>
</main>
</body>
</html>
